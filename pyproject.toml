[project]
name = "antigravity-linux-location-fix"
version = "1.0.1"
description = 'Fix "User location is not supported for the API use." (FAILED_PRECONDITION) for Antigravity Remote SSH on Linux VPS by routing only the Antigravity process tree through Cloudflare WARP.'
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/Rashomon-Chinglo/antigravity-linux-location-fix"
Repository = "https://github.com/Rashomon-Chinglo/antigravity-linux-location-fix"
Issues = "https://github.com/Rashomon-Chinglo/antigravity-linux-location-fix/issues"
Releases = "https://github.com/Rashomon-Chinglo/antigravity-linux-location-fix/releases"

[project.scripts]
ag-warp = "ag_warp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ag_warp"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
    "ty>=0.0.32",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
